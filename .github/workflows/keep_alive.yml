name: Keep Streamlit Awake

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

jobs:
  keep_alive:
    runs-on: ubuntu-latest
    steps:
      - name: Odwiedź aplikację (z ponowieniami)
        run: |
          # Streamlit bywa przez chwilę niedostępny podczas wdrożenia lub
          # wybudzania. Krótki błąd nie powinien generować fałszywego alarmu.
          curl --fail --silent --show-error --location \
            --connect-timeout 20 --max-time 120 \
            --retry 4 --retry-delay 15 --retry-all-errors --retry-connrefused \
            https://system-beta-adrian.streamlit.app/
